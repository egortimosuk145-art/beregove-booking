# Локально (на вашому компʼютері) використовуються значення після ":" за замовчуванням.
# На хостингу (Render + Neon) ці значення підставляються з Environment Variables,
# налаштованих у панелі хостингу — самі файли для цього міняти не потрібно.
# Якщо база на Neon — до DATABASE_URL обовʼязково треба додати "?sslmode=require".
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:063349}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Render (та більшість хостингів) сам призначає порт через змінну PORT.
server.port=${PORT:8080}

